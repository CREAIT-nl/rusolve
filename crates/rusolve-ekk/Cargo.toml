[package]
name = "rusolve-ekk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Faithful Rust port of the HiGHS simplex engine (HEkk) and its basis factorization (HFactor)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "ipx_normal"
harness = false

[[bench]]
name = "ti_list_sched"
harness = false

[[bench]]
name = "lu_solve_triangular"
harness = false

[[bench]]
name = "clique_partition"
harness = false
