# rusolve benchmark corpus manifest.
#
# Provenance and pins: see benches/data/ATTRIBUTION.md. Materialized instances land in
# benches/data/{lpopt,mip50}/ (gitignored): fetch, never commit.
#
# Schema (one [[instance]] per row):
#   tier     = "lpopt" | "mip50"
#   name     = instance name; materialized as benches/data/<tier>/<name>.mps
#   group    = structural group (mip50 families / lpopt hard set), used as the
#              family column in per-family benchmark reports
#   format   = "mps-bz2"  plain MPS in a .bz2        -> bz2-decode
#              "mpc-bz2"  netlib MPC (compressed MPS) in a .bz2 -> bz2 | emps
#              "mps-gz"   plain MPS in a .gz          -> gunzip
#              "mps-gz-zip-entry" <name>.mps.gz inside a zip (zip+entry keys)
#   url      = raw download URL (or zip = <url> + entry = <path-in-zip>)
#   on-demand= true -> skipped by default setup runs (big/hard tier, fetch
#              explicitly with --on-demand)
#   sha256   = pin of the *raw downloaded* file. Empty -> computed at first
#              fetch and written back here by setup_corpus.py (authoritative
#              pin thereafter); mismatch on later fetches is a hard failure.
#   size     = raw download size in bytes (pinned with sha256).

[meta]
cache = "~/.cache/rusolve-bench"
emps_source = "https://www.netlib.org/lp/data/emps.c"
# Alternate MIPLIB source if per-instance URLs ever disappear (verified
# 2026-10-25: https://miplib.zib.de/downloads/benchmark.zip, 332,664,623 B).
# Entries are "<instance>.mps.gz" at the zip root; format mps-gz-zip-entry.
miplib_benchmark_zip = "https://miplib.zib.de/downloads/benchmark.zip"
miplib_benchmark_zip_sha256 = "c756eefd544d83b31809306b45d3549a1a5b9378e6aa78b68738b1a3b6a418fa"

